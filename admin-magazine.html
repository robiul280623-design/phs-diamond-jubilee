<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Magazine Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6fa;
    color:#17233c;
}

.header{
    background:#082d63;
    color:#fff;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.header h1{
    margin:0;
    font-size:22px;
}

.header-buttons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.header button{
    border:0;
    color:#fff;
    padding:9px 14px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

#backBtn{background:#168447}
#logoutBtn{background:#dc3545}

.container{
    width:95%;
    max-width:1400px;
    margin:22px auto;
}

.top-card,
.table-card{
    background:#fff;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.top-card{
    padding:20px;
    margin-bottom:20px;
}

.top-card h2{
    margin:0 0 15px;
    color:#082d63;
}

#search{
    width:100%;
    padding:13px;
    border:1px solid #ccd4df;
    border-radius:8px;
    font-size:16px;
}

#message{
    display:block;
    margin-top:12px;
    font-weight:bold;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    min-width:1100px;
    border-collapse:collapse;
}

th{
    background:#082d63;
    color:#fff;
    padding:13px;
    text-align:left;
}

td{
    padding:11px;
    border-bottom:1px solid #e5e8ed;
    vertical-align:top;
}

.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.pending{
    background:#fff3cd;
    color:#856404;
}

.approved{
    background:#d1e7dd;
    color:#0f5132;
}

.rejected{
    background:#f8d7da;
    color:#842029;
}

.action{
    border:0;
    color:#fff;
    border-radius:6px;
    padding:8px 10px;
    cursor:pointer;
    margin:2px;
    font-weight:bold;
}

.viewBtn{background:#0969c8}
.approveBtn{background:#168447}
.rejectBtn{background:#f59e0b}
.downloadBtn{background:#6f42c1}
.deleteBtn{background:#dc3545}

.action:hover{
    opacity:.85;
}

/* MODAL */

#viewModal{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    background:rgba(0,0,0,.75);
    overflow:auto;
    padding:20px 10px;
}

.modal-card{
    width:100%;
    max-width:950px;
    margin:auto;
    background:#fff;
    border-radius:14px;
    overflow:hidden;
}

.modal-header{
    background:#082d63;
    color:#fff;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h2{
    margin:0;
}

.closeBtn{
    background:#dc3545;
    color:#fff;
    border:0;
    border-radius:6px;
    padding:8px 13px;
    cursor:pointer;
}

.modal-body{
    padding:22px;
}

.submission-title{
    color:#082d63;
    font-size:25px;
    margin-top:0;
}

.info-box{
    background:#f8fafc;
    border:1px solid #dce2ea;
    border-radius:8px;
    padding:12px;
    margin-bottom:10px;
}

.info-box strong{
    display:block;
    color:#082d63;
    margin-bottom:5px;
}

.submission-content{
    border:1px solid #dce2ea;
    border-radius:8px;
    padding:18px;
    background:#fff;
    line-height:1.8;
    white-space:pre-wrap;
    word-break:break-word;
}

.photo-title{
    color:#082d63;
    margin-top:25px;
}

.photo-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.photo-item{
    border:1px solid #ddd;
    border-radius:8px;
    overflow:hidden;
    background:#f8fafc;
}

.photo-item img{
    width:100%;
    height:220px;
    object-fit:cover;
    display:block;
}

.photo-buttons{
    display:flex;
    gap:5px;
    padding:8px;
}

.photo-buttons a,
.photo-buttons button{
    flex:1;
    border:0;
    padding:8px;
    border-radius:5px;
    text-align:center;
    cursor:pointer;
    text-decoration:none;
    font-weight:bold;
}

.openImage{
    background:#0969c8;
    color:#fff;
}

.downloadImage{
    background:#168447;
    color:#fff;
}

.modal-actions{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    padding:20px;
    border-top:1px solid #e2e6eb;
}

.modal-actions button{
    border:0;
    color:#fff;
    padding:11px 18px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

#modalApprove{background:#168447}
#modalReject{background:#f59e0b}
#modalDownload{background:#6f42c1}
#modalDelete{background:#dc3545}
#modalClose{background:#6c757d}

.empty{
    text-align:center;
    padding:30px;
    color:#777;
}

@media(max-width:700px){

    .header{
        flex-direction:column;
        align-items:stretch;
    }

    .header-buttons{
        justify-content:center;
    }

    .photo-grid{
        grid-template-columns:1fr;
    }

    .photo-item img{
        height:auto;
        max-height:400px;
    }

}
</style>
</head>

<body>

<header class="header">

<h1>📰 Magazine Admin Panel</h1>

<div class="header-buttons">

<button id="backBtn">
    Alumni Admin
</button>

<button id="logoutBtn">
    Logout
</button>

</div>

</header>


<div class="container">

<div class="top-card">

<h2>📰 Magazine Submissions</h2>

<input
    id="search"
    type="text"
    placeholder="নাম, শিরোনাম, ফোন, ইমেইল বা লেখা দিয়ে খুঁজুন..."
>

<span id="message">
    Loading...
</span>

</div>


<div class="table-card">

<div class="table-wrapper">

<table>

<thead>

<tr>
<th>Submission ID</th>
<th>Author</th>
<th>Title</th>
<th>Phone</th>
<th>Date</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>

<tbody id="submissionTable"></tbody>

</table>

</div>

</div>

</div>


<!-- VIEW MODAL -->

<div id="viewModal">

<div class="modal-card">

<div class="modal-header">

<h2>
📰 Magazine Submission
</h2>

<button
    class="closeBtn"
    id="closeModal"
>
✕
</button>

</div>


<div class="modal-body">

<h2
    id="modalTitle"
    class="submission-title"
>
-
</h2>


<div id="modalInfo"></div>


<h3>📝 লেখা</h3>

<div
    id="modalContent"
    class="submission-content"
>
-
</div>


<h3 class="photo-title">
🖼️ সংযুক্ত ছবি
</h3>

<div
    id="photoGrid"
    class="photo-grid"
></div>

</div>


<div class="modal-actions">

<button id="modalApprove">
    ✅ Approve
</button>

<button id="modalReject">
    ❌ Reject
</button>

<button id="modalDownload">
    📥 Download লেখা
</button>

<button id="modalDelete">
    🗑️ Delete
</button>

<button id="modalClose">
    Close
</button>

</div>

</div>

</div>


<script src="magazine-admin.js"></script>

</body>
</html>
