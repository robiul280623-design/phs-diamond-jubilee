<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PHS Food Token Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 12px;
    font-family: Arial, Helvetica, sans-serif;
    background: #eef3f6;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: auto;
}

.header {
    text-align: center;
    margin-bottom: 18px;
}

.header h1 {
    margin: 0;
    color: #062b3f;
    font-size: 24px;
}

.header p {
    margin: 6px 0 0;
    color: #78858e;
    font-size: 11px;
}

.scanner-card {
    background: #fff;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 8px 28px rgba(0,0,0,.12);
}

.title {
    color: #062b3f;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 12px;
}


/* =========================
   CAMERA
========================= */

#reader {
    width: 100%;
    min-height: 300px;
    overflow: hidden;
    border-radius: 12px;
    background: #111;
}


/* =========================
   GALLERY
========================= */

#qrImageInput {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
}

.gallery-label {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    border-radius: 9px;
    background: #0b5875;
    color: #fff;
    text-align: center;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}


/* =========================
   STATUS
========================= */

.status {
    display: none;
    margin-top: 15px;
    padding: 14px;
    border-radius: 9px;
    text-align: center;
    font-size: 14px;
    font-weight: bold;
}

.status.success {
    display: block;
    background: #e9f8ef;
    color: #18723c;
}

.status.error {
    display: block;
    background: #fdecec;
    color: #b42318;
}

.status.warning {
    display: block;
    background: #fff7df;
    color: #8a6200;
}


/* =========================
   MEMBER INFO
========================= */

.member-info {
    display: none;
    margin-top: 15px;
    padding: 15px;
    background: #f5f8fa;
    border-radius: 10px;
}

.info-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid #e1e7ea;
}

.info-row:last-child {
    border-bottom: none;
}

.label {
    color: #78858e;
    font-size: 11px;
}

.value {
    color: #263743;
    font-size: 13px;
    font-weight: bold;
    text-align: right;
}


/* =========================
   SCAN AGAIN
========================= */

.scan-again {
    display: none;
    width: 100%;
    margin-top: 15px;
    padding: 13px;
    border: none;
    border-radius: 9px;
    background: #062b3f;
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}


/* =========================
   FOOTER
========================= */

.footer {
    text-align: center;
    margin-top: 15px;
    color: #89949c;
    font-size: 10px;
}

</style>

</head>


<body>


<div class="container">


<div class="header">

<h1>
🍽 Food Token Scanner
</h1>

<p>
Paharchanda High School Alumni Association
</p>

</div>


<div class="scanner-card">


<div class="title">
Scan Food Token QR Code
</div>


<!-- CAMERA -->

<div id="reader"></div>


<!-- GALLERY -->

<input
    type="file"
    id="qrImageInput"
    accept="image/*"
>

<label
    for="qrImageInput"
    class="gallery-label">

🖼️ Select QR Image from Gallery

</label>


<!-- STATUS -->

<div
    id="status"
    class="status">
</div>


<!-- MEMBER -->

<div
    id="memberInfo"
    class="member-info">


<div class="info-row">

<span class="label">
Name
</span>

<span
    id="memberName"
    class="value">
</span>

</div>


<div class="info-row">

<span class="label">
Member ID
</span>

<span
    id="memberId"
    class="value">
</span>

</div>


<div class="info-row">

<span class="label">
SSC Batch
</span>

<span
    id="memberBatch"
    class="value">
</span>

</div>


<div class="info-row">

<span class="label">
Payment
</span>

<span
    id="memberPayment"
    class="value">
</span>

</div>


</div>


<button
    type="button"
    id="scanAgain"
    class="scan-again">

🔄 Scan Next Food Token

</button>


</div>


<div class="footer">

Food Token Verification System • Reunion 2027

</div>


</div>


<script src="food-scanner.js"></script>

</body>

</html>
